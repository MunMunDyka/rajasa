# Nginx site for RKL ProjectHub.
# Copy to /etc/nginx/sites-available/rkl, then:
#   ln -s /etc/nginx/sites-available/rkl /etc/nginx/sites-enabled/rkl
#   nginx -t && systemctl reload nginx
#
# Run certbot AFTER this file is in place and DNS points at the server:
#   certbot --nginx -d projecthub.example.co.id
# Certbot rewrites this file to add the TLS block and the port 80 redirect.

server {
    listen 80;
    server_name projecthub.example.co.id;   # <-- ganti dengan domainmu

    # Uploaded documents can be large-ish; the app caps them at 20 MB, so give
    # Nginx a little headroom above that or the upload dies before the app can
    # return its own error message.
    client_max_body_size 25M;

    # Next.js build assets are content-hashed, so they can be cached hard.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Auth.js builds callback URLs from these. Get them wrong and login
        # redirects land on 127.0.0.1 instead of the real domain.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 120s;
    }
}
